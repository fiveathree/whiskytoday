<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Whisky Today · 酒款</title>
<meta name="description" content="精選威士忌酒款資料、參考價格及評級">
<meta property="og:title" content="Whisky Today · Collection">
<meta property="og:description" content="Selected whisky bottlings, reference prices and ratings">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script>try{if(localStorage.getItem("wt-theme")==="dark")delete document.documentElement.dataset.theme}catch(e){}</script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/"><span class="word">WHISKY TODAY</span><span class="rule"></span></a>
    <nav class="topnav">
      <a href="/" data-i18n="nav.news">每日情報</a>
      <a href="/whisky" aria-current="page" data-i18n="nav.whisky">酒款</a>
      <a href="/trends" data-i18n="nav.trends">市場趨勢</a>
      <a href="/calculator" data-i18n="nav.calc">計算器</a>
    </nav>
    <span class="spacer"></span>
    <button class="lang" id="lang" type="button">EN</button>
    <button class="theme" id="theme" type="button"></button>
  </header>

  <div class="news">
    <aside class="filters">
      <section>
        <h3 data-i18n="f.tier">評級</h3>
        <div class="seg" id="f-tier">
          <button type="button" data-v="" aria-pressed="true" data-i18n="any">全部</button>
          <button type="button" data-v="A" aria-pressed="false" data-i18n="tier.A">A級</button>
          <button type="button" data-v="B" aria-pressed="false" data-i18n="tier.B">B級</button>
          <button type="button" data-v="C" aria-pressed="false" data-i18n="tier.C">C級</button>
        </div>
      </section>
      <section>
        <h3 data-i18n="f.category">類別</h3>
        <select class="field" id="f-cat"></select>
      </section>
    </aside>

    <main class="main">
      <div class="main-head">
        <h1 data-i18n="title.whisky">精選酒款</h1>
        <span class="count" id="count"></span>
        <input class="field search" type="search" id="q" data-i18n-ph="search.whisky" placeholder="搜尋酒款或酒廠…">
      </div>
      <div class="cards whisky-cards" id="cards" aria-live="polite"></div>
      <div class="pager">
        <button class="btn small" id="prev" type="button" data-i18n="prev">上一頁</button>
        <span id="pageinfo"></span>
        <button class="btn small" id="next" type="button" data-i18n="next">下一頁</button>
      </div>
    </main>
  </div>
</div>

<dialog id="detail" class="wide" aria-labelledby="w-title">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="w-title"></h2>
      <button class="close" type="button" id="w-close" aria-label="Close">×</button>
    </div>
    <div class="dlg-tabs" role="tablist" id="w-tabs">
      <button type="button" role="tab" data-tab="overview" aria-selected="true" data-i18n="w.overview">概覽</button>
      <button type="button" role="tab" data-tab="prices" aria-selected="false" data-i18n="w.prices">價格</button>
      <button type="button" role="tab" data-tab="news" aria-selected="false" data-i18n="w.news">相關消息</button>
    </div>
    <div class="dlg-body" id="w-body"></div>
    <p class="disclaimer w-foot" data-i18n="disclaimer.full">本頁資料僅供市場參考，並非投資建議，不保證任何成交價或回報。</p>
  </div>
</dialog>
<script type="module" src="/js/whisky.js"></script>
</body>
</html>
